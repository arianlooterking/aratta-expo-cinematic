# Builds the iOS staff app.
#
# Every run builds the app for iPhones without signing and keeps it as an .ipa
# artifact. Running it by hand also replaces the .ipa on the fixed "ios-app"
# release (https://github.com/<owner>/<repo>/releases/download/ios-app/aratta-staff.ipa),
# which the download pages offer for sideloading with Sideloadly or AltStore
# until TestFlight is set up. Sideloading signs the file with the person's own
# Apple ID, so no Apple Developer account is needed for it.
#
# Running it by hand with "Send to TestFlight" instead archives a signed build
# and uploads it to App Store Connect, where it appears in TestFlight.
#
# Secrets (Settings → Secrets and variables → Actions) for TestFlight:
#   APPLE_TEAM_ID         10-character team ID (developer.apple.com → Membership)
#   ASC_KEY_ID            App Store Connect API key ID (Users and Access → Integrations)
#   ASC_ISSUER_ID         Issuer ID shown on the same page
#   ASC_KEY_P8_BASE64     the downloaded AuthKey_XXXX.p8, base64-encoded
# Signing is automatic: Xcode creates certificates and profiles with the API key.
# Variables: ARATTA_APP_URL (portal address the app opens; defaults to the Vercel site).
name: Mobile · iOS

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the iPhone file (.ipa) on the download pages"
        type: boolean
        default: true
      testflight:
        description: "Send to TestFlight"
        type: boolean
        default: false
  push:
    paths:
      - "ios/**"
      - "mobile/**"
      - "capacitor.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mobile-ios.yml"

concurrency:
  group: mobile-ios-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: write # publishing the .ipa (GitHub release)

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      ARATTA_APP_URL: ${{ vars.ARATTA_APP_URL }}
      BUILD_NUMBER: ${{ github.run_number }}
      APP_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sync web shell and plugins
        run: npm run mobile:sync -- ios

      - name: Build for iPhone (unsigned)
        if: ${{ !inputs.testflight }}
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" MARKETING_VERSION="$APP_VERSION_NAME" \
            build | tail -n 40

      - name: Package the .ipa
        if: ${{ !inputs.testflight }}
        run: |
          app="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/App.app"
          test -d "$app"
          mkdir -p "$RUNNER_TEMP/ipa/Payload" dist-mobile
          cp -R "$app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/dist-mobile/aratta-staff-${APP_VERSION_NAME}.ipa" Payload)
          ls -lh dist-mobile

      - uses: actions/upload-artifact@v5
        if: ${{ !inputs.testflight }}
        with:
          name: aratta-staff-ios-${{ env.APP_VERSION_NAME }}
          path: dist-mobile/
          retention-days: 30

      - name: Publish the .ipa
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && !inputs.testflight }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "dist-mobile/aratta-staff-${APP_VERSION_NAME}.ipa" "$RUNNER_TEMP/aratta-staff.ipa"
          link=$(mobile/scripts/publish-release.sh ios-app \
            "Aratta Staff for iPhone ${APP_VERSION_NAME}" \
            "Unsigned iPhone build for sideloading: on a Mac or Windows computer, open aratta-staff.ipa with Sideloadly (or AltStore) and sign in with your Apple ID, then trust it on the iPhone under Settings > General > VPN & Device Management. With a free Apple ID it must be reinstalled every 7 days. Version ${APP_VERSION_NAME}, built from ${GITHUB_SHA::7}." \
            "$RUNNER_TEMP/aratta-staff.ipa")
          echo "Download link: $link" >> "$GITHUB_STEP_SUMMARY"

      - name: App Store Connect key
        if: ${{ inputs.testflight }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          key="$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          if printf '%s' "$ASC_KEY_P8_BASE64" | grep -q 'BEGIN PRIVATE KEY'; then
            # The .p8 file itself was pasted into the secret.
            printf '%s\n' "$ASC_KEY_P8_BASE64" | tr -d '\r' > "$key"
          else
            # Keep only base64 characters: secrets set from Windows PowerShell can
            # carry a byte-order mark, CRLF line ends or UTF-16 null bytes.
            printf '%s' "$ASC_KEY_P8_BASE64" | LC_ALL=C tr -cd 'A-Za-z0-9+/=' | base64 --decode > "$key"
          fi
          if ! grep -q 'BEGIN PRIVATE KEY' "$key"; then
            echo "::error::ASC_KEY_P8_BASE64 is not the AuthKey .p8 file or its base64. Set it again from the downloaded .p8."
            exit 1
          fi
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Archive and upload to TestFlight
        if: ${{ inputs.testflight }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          AUTH=(-allowProvisioningUpdates
                -authenticationKeyPath "$ASC_KEY_PATH"
                -authenticationKeyID "$ASC_KEY_ID"
                -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" MARKETING_VERSION="$APP_VERSION_NAME" \
            "${AUTH[@]}" archive | tail -n 40
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            "${AUTH[@]}" | tail -n 40
          echo "Uploaded build $BUILD_NUMBER. It shows in TestFlight once Apple finishes processing (usually 5–20 minutes)."
